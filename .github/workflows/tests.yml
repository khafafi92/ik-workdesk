name: Tests

on:
  push:
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo, gd, intl, xml, xmlreader, xmlwriter, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: composer install --no-interaction --prefer-dist --no-scripts --no-progress
      - name: Discover Laravel packages
        shell: bash
        run: |
          set +e
          output=$(php artisan package:discover --ansi 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Laravel boot failure::$output"
            exit "$status"
          fi
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate:fresh --seed --force
      - run: vendor/bin/pint --test
      - run: php artisan test
